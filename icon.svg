<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa8f5"/>
      <stop offset="60%" stop-color="#5b8dee"/>
      <stop offset="100%" stop-color="#3a6fd8"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#5b8dee" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#5b8dee" stroke-width="1.5" opacity="0.25"/>
  <!-- Center orb -->
  <circle cx="256" cy="256" r="100" fill="url(#orb)" filter="url(#glow)" opacity="0.9"/>
  <!-- A letter -->
  <text x="256" y="296" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="700"
        font-size="110" fill="#f0f4ff" opacity="0.95">A</text>
  <!-- Accent dots -->
  <circle cx="256" cy="106" r="6" fill="#5b8dee" opacity="0.8"/>
  <circle cx="374" cy="174" r="4" fill="#7aa8f5" opacity="0.6"/>
  <circle cx="374" cy="338" r="4" fill="#7aa8f5" opacity="0.6"/>
  <circle cx="256" cy="406" r="6" fill="#5b8dee" opacity="0.8"/>
  <circle cx="138" cy="338" r="4" fill="#7aa8f5" opacity="0.6"/>
  <circle cx="138" cy="174" r="4" fill="#7aa8f5" opacity="0.6"/>
</svg>
